name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Clang ${{ matrix.clang }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 with Clang 17/18
          - os: ubuntu-22.04
            clang: 17
          - os: ubuntu-22.04
            clang: 18
          # Ubuntu 24.04 with Clang 17/18/19
          - os: ubuntu-24.04
            clang: 17
          - os: ubuntu-24.04
            clang: 18
          - os: ubuntu-24.04
            clang: 19

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang ${{ matrix.clang }}
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -

          # Add LLVM repository
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ matrix.clang }} main"
          else
            sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.clang }} main"
          fi

          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.clang }} \
            llvm-${{ matrix.clang }}-dev \
            libclang-${{ matrix.clang }}-dev \
            libclang-cpp${{ matrix.clang }}-dev \
            cmake \
            ninja-build

      - name: Set Clang as default
        run: |
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ matrix.clang }} 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ matrix.clang }} 100

      - name: Configure
        run: |
          # Pin cmake to the matrix-installed LLVM. Ubuntu 24.04 runners ship
          # with llvm-17 preinstalled, which find_package would otherwise pick
          # over the matrix-requested clang version.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DLLVM_DIR=/usr/lib/llvm-${{ matrix.clang }}/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-${{ matrix.clang }}/lib/cmake/clang

      - name: Build
        run: cmake --build build

      - name: Run Golden Tests
        run: ./scripts/run-golden-tests.sh
        env:
          BUILD_DIR: build
          CLANGXX: clang++-${{ matrix.clang }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-clang${{ matrix.clang }}
          path: |
            tests/golden/*/actual.json
            tests/golden/*/input.cpp.instrumented.cpp

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find plugin runtime -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-18 --dry-run --Werror
        continue-on-error: true  # Don't fail on format issues for now

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check docs exist
        run: |
          test -f docs/trace-format.md
          test -f docs/architecture.md
          test -f docs/supported-language-subset.md
          test -f docs/frontend-integration.md
        continue-on-error: true  # Warn but don't fail if docs missing

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: sandbox/Dockerfile
          push: false
          load: true
          tags: cpp-inspector-sandbox:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test sandbox
        run: |
          echo 'int main() { int x = 5; return 0; }' | \
            docker run --rm -i cpp-inspector-sandbox:test 2>&1 | \
            grep -q '"trace"'

  publish:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-24.04
    needs: [build-and-test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (sandbox)
        id: meta-sandbox
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-sandbox
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push sandbox
        uses: docker/build-push-action@v5
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ${{ steps.meta-sandbox.outputs.tags }}
          labels: ${{ steps.meta-sandbox.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  pull-local:
    name: Pull Images on Dev Machine
    runs-on: [self-hosted, linux, local-deploy]
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-sandbox:latest
          docker pull ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-server:latest
          docker pull ghcr.io/${{ github.repository_owner }}/cpp-runtime-inspector-frontend:latest

      - name: Restart server via docker compose
        run: docker compose up -d --pull always --remove-orphans

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
