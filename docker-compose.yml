name: cpp-runtime-inspector

services:
  inspector:
    image: ghcr.io/imkiptoo/cpp-runtime-inspector-server:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - TIMEOUT=30
      - MAX_SOURCE_SIZE=1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
